<!doctype html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f47f8f">
  <meta name="description" content="SPP Project สำหรับบริหารงานขายและการเข้าพบลูกค้า">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SPP Project">
  <title>SPP Project</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <template id="login-view">
    <main class="auth-page">
      <section class="auth-brand" aria-label="SPP Project introduction">
        <div class="brand-mark">SP</div>
        <span class="brand-label">SUPERPART</span>
        <h1>งานขายที่ชัดเจน<br>เริ่มจากข้อมูลที่ไว้ใจได้</h1>
        <p>เข้าสู่ SPP Project ด้วยบัญชีที่ผู้ดูแลระบบจัดเตรียมให้</p>
        <div class="brand-orbs" aria-hidden="true"><i></i><i></i><i></i></div>
      </section>
      <section class="auth-panel">
        <form id="login-form" class="auth-card">
          <span class="eyebrow">SUPERPART • SPP PROJECT</span>
          <h2>ยินดีต้อนรับ</h2>
          <p class="muted">เข้าสู่ระบบด้วยบัญชีพนักงาน</p>
          <label class="field"><span>Username</span><input name="username" autocomplete="username" maxlength="80" required autofocus></label>
          <label class="field"><span>Password</span><span class="password-control"><input name="password" type="password" autocomplete="current-password" maxlength="256" required><button type="button" class="password-toggle" data-toggle="password">แสดง</button></span></label>
          <div class="auth-error" data-error role="alert" hidden></div>
          <button class="button button--primary button--wide" type="submit"><span data-label>เข้าสู่ระบบ</span><span class="spinner" data-spinner hidden></span></button>
          <a class="pwa-install-link" href="./install.html">ติดตั้ง SPP Project บนมือถือ</a>
        </form>
      </section>
    </main>
  </template>

  <template id="password-view">
    <main class="auth-page auth-page--compact">
      <section class="auth-panel auth-panel--center">
        <form id="password-form" class="auth-card">
          <div class="icon-tile">🔐</div>
          <span class="eyebrow">FIRST LOGIN</span>
          <h2>ตั้งรหัสผ่านใหม่</h2>
          <p class="muted">เพื่อความปลอดภัย คุณต้องเปลี่ยนรหัสผ่านก่อนเข้าใช้งานระบบ</p>
          <label class="field"><span>รหัสผ่านใหม่</span><span class="password-control"><input name="newPassword" type="password" autocomplete="new-password" minlength="9" maxlength="256" required><button type="button" class="password-toggle" data-toggle="newPassword">แสดง</button></span></label>
          <label class="field"><span>ยืนยันรหัสผ่านใหม่</span><span class="password-control"><input name="confirmPassword" type="password" autocomplete="new-password" minlength="9" maxlength="256" required><button type="button" class="password-toggle" data-toggle="confirmPassword">แสดง</button></span></label>
          <div class="auth-error" data-error role="alert" hidden></div>
          <button class="button button--primary button--wide" type="submit"><span data-label>บันทึกรหัสผ่านใหม่</span><span class="spinner" data-spinner hidden></span></button>
        </form>
      </section>
    </main>
  </template>

  <template id="dashboard-view">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand"><div class="brand-mark brand-mark--small">SP</div><div><strong>SPP Project</strong><small>SUPERPART</small></div></div>
        <nav class="nav-list"><button class="is-active" type="button" data-route="dashboard">⌂ <span>Dashboard</span></button><button type="button" data-route="visits">⌖ <span>Visit</span></button><button type="button" data-route="report">▤ <span>Report</span></button><button type="button" data-route="database" data-database-view>▦ <span>Database</span></button><button type="button" data-route="users" data-user-view>♧ <span>User Management</span></button></nav>
        <div class="sidebar-footer"><button class="profile-button" type="button" data-route="profile"><span class="avatar" data-avatar>SP</span><span><strong data-display-name></strong><small data-role></small></span></button><button class="logout-button" type="button" data-logout aria-label="ออกจากระบบ">↪</button></div>
      </aside>
      <div class="workspace">
        <header class="topbar"><div><p class="eyebrow">SPP PROJECT</p><h1>Dashboard</h1></div><div class="topbar-actions"><button class="button button--ghost mobile-route" type="button" data-route="profile">โปรไฟล์</button><button class="button button--ghost mobile-route" type="button" data-route="users" data-user-view>ผู้ใช้งาน</button><button class="button button--ghost mobile-logout" type="button" data-logout>ออกจากระบบ</button></div></header>
        <main class="page-content">
          <section class="hero-card dashboard-hero"><div><span class="eyebrow">VISIT OVERVIEW</span><h2 data-welcome>ภาพรวมการเข้าพบลูกค้า</h2><p data-dashboard-scope>กำลังโหลดข้อมูล Visit…</p></div><div class="hero-mark">SP</div></section>
          <section id="dashboard-kpis" class="dashboard-kpis"></section>
          <section class="dashboard-grid"><article class="panel dashboard-card"><div class="dashboard-card-head"><div><span class="eyebrow">7 DAYS</span><h3>แผนและผลงาน 7 วัน</h3></div></div><div id="dashboard-series" class="dashboard-series"></div></article><article class="panel dashboard-card"><div class="dashboard-card-head"><div><span class="eyebrow">THIS MONTH</span><h3>สถานะ Visit</h3></div></div><div id="dashboard-statuses" class="dashboard-statuses"></div></article></section>
          <section class="dashboard-grid"><article class="panel dashboard-card"><div class="dashboard-card-head"><div><span class="eyebrow">UPCOMING</span><h3>Visit ที่กำลังจะถึง</h3></div><button class="button button--ghost" type="button" data-route="visits">ดูทั้งหมด</button></div><div id="dashboard-upcoming" class="dashboard-visit-list"></div></article><article class="panel dashboard-card"><div class="dashboard-card-head"><div><span class="eyebrow">RECENT</span><h3>ความเคลื่อนไหวล่าสุด</h3></div><button class="button button--ghost" type="button" data-route="report">เปิด Report</button></div><div id="dashboard-recent" class="dashboard-visit-list"></div></article></section>
        </main>
      </div>
    </div>
  </template>

  <template id="users-view">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand"><div class="brand-mark brand-mark--small">SP</div><div><strong>SPP Project</strong><small>SUPERPART</small></div></div>
        <nav class="nav-list"><button type="button" data-route="dashboard">⌂ <span>Dashboard</span></button><button type="button" data-route="visits">⌖ <span>Visit</span></button><button type="button" data-route="report">▤ <span>Report</span></button><button type="button" data-route="database" data-database-view>▦ <span>Database</span></button><button class="is-active" type="button" data-route="users" data-user-view>♧ <span>User Management</span></button></nav>
        <div class="sidebar-footer"><button class="profile-button" type="button" data-route="profile"><span class="avatar" data-avatar>SP</span><span><strong data-display-name></strong><small data-role></small></span></button><button class="logout-button" type="button" data-logout aria-label="ออกจากระบบ">↪</button></div>
      </aside>
      <div class="workspace">
        <header class="topbar"><div><p class="eyebrow">SPP PROJECT</p><h1>User Management</h1></div><div class="topbar-actions"><button class="button button--ghost" type="button" data-user-template>ดาวน์โหลด Template</button><button class="button button--ghost" type="button" data-user-export>Export ตาม Filter</button><label class="button button--primary file-button" data-user-import-label>Import CSV<input id="user-import-file" type="file" accept=".csv,text/csv" hidden></label><button class="button button--ghost mobile-route" type="button" data-route="profile">โปรไฟล์</button><button class="button button--ghost mobile-route" type="button" data-route="dashboard">Dashboard</button><button class="button button--ghost mobile-logout" type="button" data-logout>ออกจากระบบ</button></div></header>
        <main class="page-content">
          <section class="page-actions"><div><h2>ผู้ใช้งานและสิทธิ์</h2><p>จัดการบัญชี Role สถานะ รหัสผ่านชั่วคราว และ Permission ราย User</p></div><button class="button button--primary" type="button" data-user-action="new">+ เพิ่มผู้ใช้</button></section>
          <section class="admin-user-layout">
            <article class="panel table-panel admin-user-list">
              <div class="toolbar"><input id="user-search" class="search" placeholder="ค้นหาชื่อหรือ Username" aria-label="ค้นหาผู้ใช้"><select id="user-status-filter" aria-label="กรองสถานะ"><option value="ALL">ทุกสถานะ</option><option value="ACTIVE">Active</option><option value="DISABLED">Disabled</option></select></div>
              <div id="user-list-empty" class="empty-state" hidden>ไม่พบผู้ใช้ตามเงื่อนไข</div>
              <div class="responsive-table"><table class="admin-user-table"><colgroup><col data-user-col="user"><col data-user-col="role"><col data-user-col="status"></colgroup><thead><tr><th data-user-column="user">ผู้ใช้งาน<span class="column-resize-handle" data-user-resize="user"></span></th><th data-user-column="role">Role<span class="column-resize-handle" data-user-resize="role"></span></th><th data-user-column="status">สถานะ<span class="column-resize-handle" data-user-resize="status"></span></th></tr></thead><tbody id="admin-user-rows"></tbody></table></div>
            </article>
            <aside class="panel admin-user-detail" data-user-detail aria-label="รายละเอียดผู้ใช้" hidden>
              <form id="admin-user-form" novalidate><input type="hidden" name="userId"><input type="hidden" name="version">
                <div class="panel-head"><div><span id="admin-form-mode" class="eyebrow">USER DETAIL</span><h3 id="admin-user-heading">เลือกผู้ใช้งาน</h3></div><div class="user-detail-head-actions"><span id="admin-user-status" class="status">—</span><button class="icon-button" type="button" data-user-action="close" aria-label="ปิดรายละเอียดผู้ใช้">×</button></div></div>
                <div id="admin-form-error" class="auth-error" role="alert" hidden></div>
                <label class="field"><span>Display name *</span><input name="displayName" maxlength="120" required></label>
                <label class="field"><span>Username *</span><input name="username" maxlength="80" pattern="[a-z0-9._-]{3,80}" autocomplete="off" required></label>
                <label class="field"><span>Role *</span><select name="roleCode" required><option value="ADMIN">Admin</option><option value="MANAGER">Manager</option><option value="SALES">Sales</option><option value="AUDITOR">Auditor</option></select></label>
                <label id="create-password-field" class="field"><span>Temporary password *</span><span class="password-control"><input name="temporaryPassword" type="password" minlength="9" maxlength="256" autocomplete="new-password"><button type="button" class="password-toggle" data-toggle="temporaryPassword">แสดง</button></span></label>
                <div id="edit-user-actions" hidden>
                  <div class="admin-actions"><button id="admin-status-action" class="button button--ghost" type="button" data-user-action="toggle-status">Deactivate</button><button class="button button--ghost" type="button" data-user-action="show-reset">ตั้งรหัสชั่วคราวใหม่</button></div>
                  <div id="password-reset-panel" class="password-reset-panel" hidden><label class="field"><span>รหัสผ่านชั่วคราวใหม่ *</span><span class="password-control"><input name="resetPassword" type="password" minlength="9" maxlength="256" autocomplete="new-password"><button type="button" class="password-toggle" data-toggle="resetPassword">แสดง</button></span></label><button class="button button--ghost button--wide" type="button" data-user-action="reset-password">บันทึกรหัสชั่วคราว</button></div>
                </div>
                <button id="admin-save-user" class="button button--primary button--wide" type="submit"><span data-form-label>สร้างผู้ใช้</span><span class="spinner" data-form-spinner hidden></span></button>
                <fieldset id="user-permission-panel" class="permission-panel" hidden><legend>Permission overrides</legend><p>Inherit ใช้ค่าจาก Role ส่วน Allow/Deny เป็นข้อยกเว้นเฉพาะ User</p><div id="user-permission-options"></div><button class="button button--ghost button--wide" type="button" data-user-action="save-permissions">บันทึกสิทธิราย User</button></fieldset>
                <small class="security-caption">ทุกคำสั่งตรวจ Session และสิทธิ์ ADMIN ซ้ำที่ Server รหัสผ่านและ Token จะไม่ถูกส่งกลับมาที่ Browser</small>
              </form>
            </aside>
          </section>
        </main>
      </div>
    </div>
  </template>

  <template id="user-import-preview-template">
    <div class="modal-backdrop"><section class="panel import-preview-dialog"><div class="visit-editor-head"><div><span class="eyebrow">USER IMPORT</span><h3>ตรวจสอบผู้ใช้ก่อน Import</h3></div><button class="icon-button" type="button" data-user-import-close>×</button></div><div id="user-import-summary" class="report-summary"></div><p class="muted">ระบบใช้ Username เป็นหลัก: Username ใหม่ = CREATE, Username เดิม = UPDATE และจะไม่ Export รหัสผ่าน</p><div class="database-table-wrap import-preview-table-wrap"><table class="data-table"><thead><tr><th>แถว</th><th>ผล</th><th>Error</th><th>Username</th><th>Display name</th><th>Role</th><th>Status</th><th>Temporary password</th></tr></thead><tbody id="user-import-preview-body"></tbody></table></div><div class="import-preview-actions"><button class="button button--ghost" type="button" data-user-import-cancel>ยกเลิก</button><button class="button button--primary" type="button" data-user-import-commit>ยืนยัน Import</button></div></section></div>
  </template>

  <template id="profile-view">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand"><div class="brand-mark brand-mark--small">SP</div><div><strong>SPP Project</strong><small>SUPERPART</small></div></div>
        <nav class="nav-list"><button type="button" data-route="dashboard">⌂ <span>Dashboard</span></button><button type="button" data-route="visits">⌖ <span>Visit</span></button><button type="button" data-route="report">▤ <span>Report</span></button><button type="button" data-route="database" data-database-view>▦ <span>Database</span></button><button type="button" data-route="users" data-user-view>♧ <span>User Management</span></button></nav>
        <div class="sidebar-footer"><button class="profile-button is-active" type="button" data-route="profile"><span class="avatar" data-avatar>SP</span><span><strong data-display-name></strong><small data-role></small></span></button><button class="logout-button" type="button" data-logout aria-label="ออกจากระบบ">↪</button></div>
      </aside>
      <div class="workspace">
        <header class="topbar"><div><p class="eyebrow">SPP PROJECT</p><h1>My Profile</h1></div><div class="topbar-actions"><button class="button button--ghost mobile-route" type="button" data-route="dashboard">Dashboard</button><button class="button button--ghost mobile-route" type="button" data-route="users" data-user-view>ผู้ใช้งาน</button><button class="button button--ghost mobile-logout" type="button" data-logout>ออกจากระบบ</button></div></header>
        <main class="page-content">
          <section class="profile-layout">
            <article class="panel profile-summary"><div class="profile-avatar" data-avatar>SP</div><span class="eyebrow">MY PROFILE</span><h2 data-display-name></h2><div class="profile-meta"><div><span>Username</span><strong data-profile-username></strong></div><div><span>Role</span><strong data-role></strong></div></div><p>ข้อมูลบัญชีเป็นแบบอ่านอย่างเดียว หากต้องการแก้ชื่อหรือ Role ให้ติดต่อผู้ดูแลระบบ</p></article>
            <article class="panel profile-security"><div class="panel-head"><div><span class="eyebrow">SECURITY</span><h3>เปลี่ยนรหัสผ่าน</h3></div><div class="icon-tile">🔐</div></div>
              <form id="profile-password-form" novalidate>
                <div class="auth-error" data-error role="alert" hidden></div>
                <label class="field"><span>รหัสผ่านปัจจุบัน</span><span class="password-control"><input name="currentPassword" type="password" autocomplete="current-password" maxlength="256" required><button type="button" class="password-toggle" data-toggle="currentPassword">แสดง</button></span></label>
                <label class="field"><span>รหัสผ่านใหม่</span><span class="password-control"><input name="newPassword" type="password" autocomplete="new-password" minlength="9" maxlength="256" required><button type="button" class="password-toggle" data-toggle="newPassword">แสดง</button></span></label>
                <label class="field"><span>ยืนยันรหัสผ่านใหม่</span><span class="password-control"><input name="confirmPassword" type="password" autocomplete="new-password" minlength="9" maxlength="256" required><button type="button" class="password-toggle" data-toggle="confirmPassword">แสดง</button></span></label>
                <button class="button button--primary button--wide" type="submit"><span data-label>เปลี่ยนรหัสผ่าน</span><span class="spinner" data-spinner hidden></span></button>
                <small class="security-caption">เมื่อเปลี่ยนสำเร็จ Session เดิมทั้งหมดจะถูกเพิกถอน และหน้านี้จะใช้ Session ใหม่โดยอัตโนมัติ</small>
              </form>
            </article>
          </section>
        </main>
      </div>
    </div>
  </template>

  <template id="database-view">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand"><div class="brand-mark brand-mark--small">SP</div><div><strong>SPP Project</strong><small>SUPERPART</small></div></div>
        <nav class="nav-list"><button type="button" data-route="dashboard">⌂ <span>Dashboard</span></button><button type="button" data-route="visits">⌖ <span>Visit</span></button><button type="button" data-route="report">▤ <span>Report</span></button><button class="is-active" type="button" data-route="database" data-database-view>▦ <span>Database</span></button><button type="button" data-route="users" data-user-view>♧ <span>User Management</span></button></nav>
        <div class="sidebar-footer"><button class="profile-button" type="button" data-route="profile"><span class="avatar" data-avatar>SP</span><span><strong data-display-name></strong><small data-role></small></span></button><button class="logout-button" type="button" data-logout aria-label="ออกจากระบบ">↪</button></div>
      </aside>
      <div class="workspace">
        <header class="topbar"><div><p class="eyebrow">SPP PROJECT</p><h1>Database</h1></div><div class="topbar-actions"><button class="button button--ghost" type="button" data-db-template>ดาวน์โหลด Template</button><button class="button button--ghost" type="button" data-db-export>Export ตาม Filter</button><label class="button button--primary file-button">Import CSV<input id="db-import-file" type="file" accept=".csv,text/csv" hidden></label></div></header>
        <main class="page-content">
          <section id="db-entity-tabs" class="database-tabs" role="tablist"></section>
          <section class="page-actions"><div><h2 data-db-title>Branch</h2><p>จัดการข้อมูลหลัก พร้อม Import และ Export ตามตัวกรอง</p></div><button class="button button--primary" type="button" data-db-new>+ เพิ่มข้อมูล</button></section>
          <section class="database-layout">
            <article class="panel table-panel">
              <div class="toolbar database-toolbar"><input id="db-search" class="search" placeholder="ค้นหาทุกคอลัมน์"><span class="muted">คลิกชื่อคอลัมน์เพื่อ Sort และกรองใต้หัวตาราง</span></div>
              <div class="database-table-wrap database-records-scroll"><table class="data-table database-table"><colgroup id="db-table-cols"></colgroup><thead id="db-table-head"></thead><tbody id="db-table-body"></tbody></table></div>
              <div class="database-pagination"><div class="database-display-controls"><label class="page-size-control">แถวต่อหน้า <select data-db-page-size aria-label="จำนวนแถวต่อหน้า"><option value="25">25</option><option value="50">50</option><option value="100">100</option><option value="300">300</option><option value="500">500</option><option value="1000">1000</option></select></label><label class="page-size-control">ความสูงแถว <select data-db-row-height aria-label="ความสูงของแถว"><option value="40">เล็ก</option><option value="52">ปกติ</option><option value="64">ใหญ่</option><option value="80">ใหญ่มาก</option></select></label></div><span data-db-total>ทั้งหมด 0 รายการ</span><button class="button button--ghost" type="button" data-db-prev>ก่อนหน้า</button><span data-db-page>หน้า 1</span><button class="button button--ghost" type="button" data-db-next>ถัดไป</button></div>
            </article>
            <article class="panel database-form-panel" data-db-detail hidden>
              <form id="database-form"><div class="database-form-head"><div><span class="eyebrow">DATABASE DETAIL</span><h3 data-db-form-title>เพิ่มข้อมูล</h3></div><button class="icon-button" type="button" data-db-close aria-label="ปิดแบบฟอร์ม">×</button></div><div class="auth-error" data-error hidden></div><div id="db-fields" class="database-fields"></div><button class="button button--primary button--wide" type="submit"><span data-label>บันทึกข้อมูล</span><span class="spinner" data-spinner hidden></span></button><button class="button button--ghost button--wide" type="button" data-db-delete hidden>ลบข้อมูล</button></form>
            </article>
          </section>
        </main>
      </div>
    </div>
